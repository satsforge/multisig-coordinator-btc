<body>
<div class="app">

<div class="topbar">
  <div class="brand"><span class="coin">₿</span> <span data-i18n="topbar.brand">Coordinador Multifirma BTC</span></div>
  <div class="topbar-actions">
    <span id="network-badge" class="badge badge-testnet">TESTNET</span>
    <button class="theme-toggle" id="lang-toggle" type="button" data-i18n="topbar.lang.toEnglish">🌐 English</button>
    <button class="theme-toggle" id="theme-toggle" type="button" data-i18n="topbar.theme.toLight">☀ Modo claro</button>
  </div>
</div>

<main>

<section id="screen-setup" class="screen">
  <div class="panel">
    <div class="notice notice-info" data-i18n="notice.phase">
      <strong>Fase 1 de 3</strong>...
    </div>

    <h2 data-i18n="setup.title">Configurar wallet multifirma</h2>

    <form id="setup-form">
      <fieldset class="network-choice">
        <legend data-i18n="network.legend">Red</legend>
        <label><input type="radio" name="network" id="network-testnet" checked> <span data-i18n="network.testnet.label">Testnet (recomendado para probar)</span></label>
        <label><input type="radio" name="network" id="network-mainnet"> <span data-i18n="network.mainnet.label">Mainnet (Bitcoin real)</span></label>
        <label id="mainnet-confirm-wrap" hidden class="mainnet-confirm">
          <input type="checkbox" id="mainnet-confirm-checkbox">
          <span data-i18n="network.mainnet.confirm">Entiendo que voy a operar con Bitcoin real y puedo perder mis fondos si me equivoco.</span>
        </label>
      </fieldset>

      <div class="quorum-row">
        <label class="field">
          <span data-i18n="setup.m.label">M (firmas requeridas)</span>
          <input type="number" id="quorum-m" min="1" max="15" value="2">
        </label>
        <label class="field">
          <span data-i18n="setup.n.label">N (cantidad de cosigners)</span>
          <input type="number" id="quorum-n" min="1" max="15" value="3">
        </label>
      </div>

      <div class="mode-toggle-row">
        <button type="button" id="mode-manual-btn" aria-pressed="true" data-i18n="setup.mode.manual">Agregar cosigners uno por uno</button>
        <button type="button" id="mode-descriptor-btn" aria-pressed="false" data-i18n="setup.mode.descriptor">Pegar un descriptor ya armado</button>
      </div>

      <div id="manual-fields">
        <div id="cosigner-list"></div>
      </div>

      <div id="descriptor-fields" hidden>
        <label class="field">
          <span data-i18n="setup.descriptor.label">Descriptor (wsh(sortedmulti(...)))</span>
          <textarea id="descriptor-input" rows="4" autocomplete="off" spellcheck="false"></textarea>
          <div class="file-load-row">
            <button type="button" class="btn-secondary" id="descriptor-file-btn" data-i18n="fileLoad.button">📁 Cargar desde archivo</button>
            <input type="file" id="descriptor-file-input" accept=".txt,text/plain" hidden>
          </div>
        </label>
        <p class="hint" data-i18n="setup.descriptor.hint">Pegá el descriptor "externo"...</p>
      </div>

      <p id="setup-error" class="error" hidden></p>

      <button type="submit" id="setup-build-btn" class="btn-primary" data-i18n="setup.build">Armar wallet y consultar saldo</button>
    </form>
  </div>
</section>

<section id="screen-scan" class="screen" hidden>
  <div class="panel">
    <h2 data-i18n="scan.title">Consultando la red...</h2>
    <div class="spinner"></div>
    <div id="scan-progress" class="scan-log"></div>
  </div>
</section>

<section id="screen-dashboard" class="screen" hidden>
  <div class="panel">
    <div class="actions-row" style="margin-top:0;">
      <span id="dashboard-quorum-badge" class="badge badge-quorum"></span>
    </div>
    <div class="balance-card">
      <span class="balance-label" data-i18n="dashboard.balance.label">Saldo total</span>
      <span class="balance-value" id="dashboard-balance">0 BTC</span>
    </div>
    <div class="actions-row">
      <button type="button" id="dashboard-update-btn" class="btn-primary" data-i18n="dashboard.update">Actualizar</button>
      <button type="button" id="dashboard-new-btn" class="btn-secondary" data-i18n="dashboard.newWallet">Nueva wallet</button>
    </div>
  </div>

  <div class="panel">
    <h2 data-i18n="dashboard.receive.title">Recibir</h2>
    <div class="receive-panel">
      <img id="receive-qr" alt="">
      <div class="mono" id="receive-address"></div>
      <div class="actions-row" style="justify-content:center;">
        <button type="button" id="receive-copy-btn" class="btn-secondary btn-small" data-i18n="dashboard.receive.copy">Copiar direccion</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2 data-i18n="dashboard.export.title">Exportar configuracion</h2>
    <p class="hint" data-i18n="dashboard.export.hint">Esta herramienta no guarda nada...</p>
    <div class="actions-row">
      <button type="button" id="export-download-btn" class="btn-secondary" data-i18n="dashboard.export.download">⬇ Descargar descriptores (.txt)</button>
    </div>
  </div>

  <div class="panel">
    <h2 data-i18n="dashboard.addresses.title">Direcciones</h2>
    <div class="actions-row" style="margin-top:0; margin-bottom: 0.5rem;">
      <button type="button" id="addresses-toggle-btn" class="btn-secondary btn-small"></button>
    </div>
    <ul class="address-list" id="address-list"></ul>
  </div>
</section>

</main>

<p class="footer-note" data-i18n="footer.note">
  Solo entiende claves publicas...
</p>

</div>
